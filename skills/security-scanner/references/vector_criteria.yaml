# Критерии верификации находок (по образцу Ghost scan-code/criteria).
#
# Назначение: превратить перепроверку High/Critical (SKILL.md Шаг 3) из общего
# «эксплуатируемо ли?» в ПОШАГОВУЮ проверку по критериям класса + обязательный
# шаг «поиск пропущенных митигаций». Верификатор для каждой находки:
#   1. подтверждает, что код по адресу реально существует (±2 строки, та функция);
#   2. проверяет КАЖДЫЙ criterion класса — confirmed/not-confirmed с пруфом;
#   3. отдельным шагом ищет mitigations (ниже) — framework-защиту, валидацию,
#      безопасные дефолты; найденная непокрытая митигация => находка снимается;
#   4. выносит вердикт: verified | rejected(<refusal_category>).
#
# refusal_category (enum; сохраняет политику скилла «DoS и т.п. — не блокер»):
#   theoretical       — путь недостижим во всех реалистичных сценариях
#   mitigated         — есть работающая защита (framework/валидация/дефолт)
#   false-positive    — сканер ошибся, уязвимого кода нет
#   unreachable       — код мёртв / не вызывается / не на пути внешних данных
#   best-practice-only — гигиена без эксплуатируемого impact (напр. DoS по политике §1)
#
# НЕ снимать находку только потому, что эксплуатация сложна или требует цепочки:
# если она реальна и достижима — verified.

defaults:
  verify_steps:
    - "Код по адресу существует (файл, ~строка ±2, та же функция/метод)"
    - "Каждый criterion класса подтверждён пруфом (file:line / grep / конфиг)"
    - "Выполнен отдельный поиск митигаций (2–3 точечных проверки, не повторный полный анализ)"
    - "Вынесен вердикт verified | rejected(<refusal_category>) с 1–2 фразами обоснования"

classes:
  CWE-89:  # SQL injection
    criteria:
      - "Пользовательский ввод достигает SQL-запроса без параметризации"
      - "Запрос собран конкатенацией/интерполяцией вместо prepared statement"
      - "Ввод не валидируется/не экранируется до подстановки"
      - "Путь достижим извне (HTTP/API/gRPC/WS) без доступа к ФС/контейнеру"
    mitigations:
      - "ORM с авто-параметризацией (SQLAlchemy Core/ORM, Django ORM, Hibernate)"
      - "Prepared statement / bind-параметры (?, :name) по всему пути"
      - "Allowlist для имён таблиц/колонок, если они динамические"

  CWE-78:  # OS command injection
    criteria:
      - "Пользовательский ввод достигает запуска команды ОС"
      - "Команда собрана строкой/шеллом (shell=True, Runtime.exec(String))"
      - "Нет allowlist и нет argv-разбиения аргументов"
      - "Путь достижим извне"
    mitigations:
      - "Запуск через массив argv без shell (subprocess.run([...]), ProcessBuilder)"
      - "Жёсткий allowlist допустимых значений/бинарей"
      - "Полное экранирование shlex.quote при неизбежном шелле"

  CWE-79:  # XSS
    criteria:
      - "Пользовательский ввод попадает в HTML/JS-ответ или DOM"
      - "Вывод не экранируется (raw-html, innerHTML, |safe, @Html.Raw)"
      - "Нет CSP, снимающего исполнение инъекции"
    mitigations:
      - "Автоэкранирование шаблонизатора (Jinja2 autoescape, Razor, React JSX)"
      - "textContent вместо innerHTML; безопасные DOM-API"
      - "Контекстное экранирование вывода на всех ветках"

  CWE-22:  # Path traversal / CWE-434 upload — аналогично
    criteria:
      - "Пользовательский ввод попадает в путь файловой операции"
      - "Нет нормализации пути и проверки принадлежности базовой директории"
      - "Путь достижим извне"
    mitigations:
      - "Нормализация + проверка префикса базовой директории (realpath startswith)"
      - "Разрешение только whitelисте имён/расширений"

  CWE-502:  # Небезопасная десериализация
    criteria:
      - "Недоверенные данные десериализуются опасным загрузчиком (pickle, yaml.load, ObjectInputStream)"
      - "Нет схемной/типовой валидации до десериализации"
    mitigations:
      - "Безопасный загрузчик (yaml.safe_load, json)"
      - "Схемная валидация и allowlist классов"

  CWE-611:  # XXE
    criteria:
      - "XML из недоверенного источника парсится с включёнными внешними сущностями"
    mitigations:
      - "Отключение DTD/внешних сущностей (resolve_entities=False, FEATURE_SECURE_PROCESSING)"

  CWE-798:  # Секреты/учётки в коде
    criteria:
      - "Секрет/пароль/ключ задан литералом в исходнике или конфиге репозитория"
      - "Значение не является очевидной заглушкой (${VAR}, '', changeme-плейсхолдер)"
    mitigations:
      - "Чтение из env/secret-manager; значение в коде — плейсхолдер"
      - "pre-commit gitleaks + secret-scan в CI"

  CWE-862:  # Отсутствие авторизации
    criteria:
      - "Чувствительный маршрут/действие доступны без проверки прав"
      - "Нет декоратора/middleware авторизации на пути"
      - "Объект доступен по идентификатору без проверки владельца (IDOR)"
    mitigations:
      - "Декоратор/middleware авторизации на маршруте"
      - "Проверка владельца объекта перед доступом"

  CWE-352:  # CSRF
    criteria:
      - "State-changing запрос (POST/PUT/DELETE) без anti-CSRF токена в форме/запросе"
      - "Защита не видна статически во фронте/шаблоне (см. SKILL §9: рантайм-гвард без следа не проходит)"
    mitigations:
      - "CSRF-токен в форме/заголовке + серверная проверка (csrf_template_lint.py — пруф)"
      - "SameSite=strict/lax cookie как дополнительный, не единственный, слой"

  CWE-327:  # Слабая криптография / CWE-330/338 слабый ГПСЧ
    criteria:
      - "Используется слабый алгоритм (MD5/SHA1 для паролей, DES) или небезопасный ГПСЧ для секретов"
      - "Результат используется в security-контексте (пароль, токен, nonce)"
    mitigations:
      - "bcrypt/scrypt/argon2 для паролей; SHA-256+ для целостности"
      - "secrets/SecureRandom для security-значений"

# Классы, которые по политике скила (scanners_and_tooling.md §1, §10) по умолчанию
# НЕ блокер без доказанного impact — помечать rejected(best-practice-only), если
# impact не доказан: CWE-400 (ReDoS/DoS), часть misconfig без внешнего эффекта.
non_blocking_without_impact:
  - CWE-400
