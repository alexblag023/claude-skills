rules:
  # PHP: taint-правила с источниками суперглобалов (GET/POST/REQUEST/COOKIE) и тела запроса (php://input).
  # Закрывают классы, которые реестровые наборы Semgrep OSS (p/php, p/security-audit, p/owasp-top-ten)
  # пропускают на типовом уязвимом PHP-приложении: SQL-инъекция конкатенацией, внедрение команд, XSS через
  # echo, обход пути / LFI, небезопасная десериализация, слабая крипто для паролей, секреты в коде.
  # Правила общие (без привязки к конкретному приложению); общий набор источников задан якорем &src.

  - id: gap-php-sql-injection
    mode: taint
    languages: [php]
    severity: ERROR
    message: "CWE-89: данные запроса конкатенируются в SQL-запрос (mysqli_query/PDO->query). Используйте подготовленные выражения с параметрами (PDO::prepare + execute), не стройте SQL из ввода."
    metadata: {cwe: "CWE-89", owasp: "A03:2021"}
    pattern-sources: &src
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_REQUEST
      - pattern: $_COOKIE
      - pattern: file_get_contents("php://input")
    pattern-sinks:
      - pattern: mysqli_query(...)
      - pattern: mysql_query(...)
      - pattern: $CONN->query(...)
      - pattern: $CONN->exec(...)
    pattern-sanitizers:
      - pattern: (int)$X
      - pattern: intval(...)
      - pattern: mysqli_real_escape_string(...)

  - id: gap-php-command-injection
    mode: taint
    languages: [php]
    severity: ERROR
    message: "CWE-78: данные запроса попадают в system/exec/shell_exec/passthru/popen/proc_open (или обратные кавычки). Не собирайте команду из ввода: фиксированная команда + аргументы через escapeshellarg/allow-list."
    metadata: {cwe: "CWE-78", owasp: "A03:2021"}
    pattern-sources: *src
    pattern-sinks:
      - pattern: system(...)
      - pattern: exec(...)
      - pattern: shell_exec(...)
      - pattern: passthru(...)
      - pattern: popen(...)
      - pattern: proc_open(...)
    pattern-sanitizers:
      - pattern: escapeshellarg(...)
      - pattern: escapeshellcmd(...)
      - pattern: intval(...)

  - id: gap-php-xss-echo
    mode: taint
    languages: [php]
    severity: ERROR
    message: "CWE-79 XSS: данные запроса выводятся в HTML через echo/print без кодирования. Применяйте htmlspecialchars($x, ENT_QUOTES) или шаблонизатор с автоэкранированием."
    metadata: {cwe: "CWE-79", owasp: "A03:2021"}
    pattern-sources: *src
    pattern-sinks:
      - pattern: echo $X;
      - pattern: print $X;
      - patterns:
          - pattern: printf($FMT, ...)
          - focus-metavariable: $FMT
    pattern-sanitizers:
      - pattern: htmlspecialchars(...)
      - pattern: htmlentities(...)
      - pattern: intval(...)
      - pattern: (int)$X

  - id: gap-php-path-traversal
    mode: taint
    languages: [php]
    severity: ERROR
    message: "CWE-22 обход пути / LFI: имя файла берётся из запроса и попадает в include/require/fopen/file_get_contents/readfile. Нормализуйте через basename и проверяйте по allow-list."
    metadata: {cwe: "CWE-22", owasp: "A01:2021"}
    pattern-sources: *src
    pattern-sinks:
      - pattern: include $X;
      - pattern: include_once $X;
      - pattern: require $X;
      - pattern: require_once $X;
      - pattern: fopen($X, ...)
      - pattern: file_get_contents($X)
      - pattern: readfile($X)
    pattern-sanitizers:
      - pattern: basename(...)

  - id: gap-php-unsafe-deserialization
    mode: taint
    languages: [php]
    severity: ERROR
    message: "CWE-502 небезопасная десериализация: unserialize применяется к данным запроса (GET/COOKIE и т.п.). Это RCE через POP-цепочки. Используйте json_decode или unserialize с allowed_classes=false."
    metadata: {cwe: "CWE-502", owasp: "A08:2021"}
    pattern-sources: *src
    pattern-sinks:
      - pattern: unserialize($X)

  - id: gap-php-weak-hash-password
    languages: [php]
    severity: ERROR
    message: "CWE-327: md5/sha1 не годятся для хеширования паролей (быстрые, без соли). Используйте password_hash() с PASSWORD_DEFAULT/bcrypt и password_verify()."
    metadata: {cwe: "CWE-327", owasp: "A02:2021", note: "эвристика: срабатывает на любое использование md5/sha1, проверьте назначение"}
    pattern-either:
      - pattern: md5(...)
      - pattern: sha1(...)

  - id: gap-php-hardcoded-secret
    languages: [php]
    severity: ERROR
    message: "CWE-798: пароль, ключ или токен задан строковым литералом. Вынесите в переменные окружения/секрет-хранилище; если значение было в git — отзовите и ротируйте."
    metadata: {cwe: "CWE-798", owasp: "A07:2021", note: "по имени переменной; значения-заглушки (${...}, <...>, пусто) исключены"}
    patterns:
      - pattern: $VAR = "$VAL";
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(pass(word|wd|phrase)?|pwd|secret|api_?key|token|credential|private_?key).*
      - metavariable-regex:
          metavariable: $VAL
          regex: ^(?!\$\{)(?!<)(?!\*+$)(?!x+$).{4,}$
