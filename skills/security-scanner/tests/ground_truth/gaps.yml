# Ground-truth для eval-харнесса (tests/score.py). Декларативная разметка:
# каждый finding = ОДНА истинная локация уязвимости в корпусе.
#
# Поля: file, cwe, line (1-индекс), anchor (подстрока РОВНО на строке line —
# защита от дрейфа: score.py падает, если якорь уехал/исчез), rule (опц. —
# ожидаемое собственное gap-* правило; где нет, класс покрывается реестром Semgrep).
#
# Пути corpus_root/safe_root — относительно каталога ЭТОГО файла.
# ВАЖНО: anchor каждого finding проверяется `python tests/score.py` перед подсчётом.
