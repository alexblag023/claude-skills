# ожидаемое собственное gap-* правило; где нет, класс покрывается реестром Semgrep).
#
# Пути corpus_root/safe_root — относительно каталога ЭТОГО файла.
# ВАЖНО: anchor каждого finding проверяется `python tests/score.py` перед подсчётом.
