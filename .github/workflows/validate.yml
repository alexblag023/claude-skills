name: validate-skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # actions пинуются по полному SHA (v4)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Проверка формата скиллов и утечек
        run: python3 scripts/validate_skills.py
      - name: Регрессионные тесты линтера CSRF (security-scanner)
        run: python3 skills/security-scanner/tests/run_csrf_lint_tests.py
      - name: Тесты свода внешних отчётов (security-scanner)
        run: python3 skills/security-scanner/tests/run_ingest_tests.py
