name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      # actions пинуются по полному SHA (v4); нужна полная история для диапазона коммитов PR
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Проверка подписи DCO (Signed-off-by)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_dco.py "$BASE_SHA" "$HEAD_SHA"
